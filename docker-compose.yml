services:
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-todolist}
      MYSQL_USER: ${DB_USER:-todouser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - todolist-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  backend:
    image: alishafatima797/three-tier-backend:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todolist-backend
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-todouser}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-todolist}
      PORT: 8080
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todolist-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 20s

  frontend:
    image: alishafatima797/three-tier-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: todolist-frontend
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todolist-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  todolist-network:
    driver: bridge
